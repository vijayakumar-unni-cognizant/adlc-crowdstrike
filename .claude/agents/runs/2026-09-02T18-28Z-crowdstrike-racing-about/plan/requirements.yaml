  package: adlc-crowdstrike
  java_group_id: com.adlccrowdstrike
  component_group: "ADLC Crowdstrike - Content"
  identifier_source: "Root and module Maven POMs; .aem-skills-config.yaml is absent."
goals:
  - "Deliver an authorable, server-rendered AEM Sites About page that faithfully reproduces the current 2026 CrowdStrike Racing reference."
  - "Preserve the reference hierarchy, imagery, typography character, spatial rhythm, alternating editorial layout, navigation, footer, and responsive behavior."
  - "Seed the sample page and all approved source images into AEM content/DAM without production hotlinks."
personas:
  - racing_fan
  - cybersecurity_customer
  - aem_content_author
  - accessibility_and_quality_reviewer
reference_sources:
