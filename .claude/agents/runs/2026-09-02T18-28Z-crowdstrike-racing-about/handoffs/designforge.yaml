components_specified:
  - name: site-header
    role: atomic semantic header/navigation/mobile menu
    reuse_or_new: new-custom
    extends: none
    sling_model_class: com.adlccrowdstrike.aem.core.models.SiteHeaderModel
    accessors: [logoReference, logoAlt, homeUrl, navigationLabel, menuLabel, closeLabel, teamLabel, teamUrl, teamItems, primaryItems, currentPath]
  - name: teaser
    role: hero plus four editorial sections through Style System
    reuse_or_new: reuse-core-proxy
    extends: core/wcm/components/teaser/v2/teaser
    sling_model_class: core-component-inherited
    variants: [cmp-teaser--racing-hero, cmp-teaser--racing-editorial, cmp-teaser--racing-content-first, cmp-teaser--racing-media-first, cmp-teaser--racing-light, cmp-teaser--racing-dark]
  - name: container
    role: page/main authoring contexts and full-bleed/content-width bands
    reuse_or_new: reuse-core-proxy
    extends: core/wcm/components/container/v1/container
    sling_model_class: core-component-inherited
  - name: site-footer
    role: atomic grouped links/social/brand/legal footer
    reuse_or_new: new-custom
    extends: none
    sling_model_class: com.adlccrowdstrike.aem.core.models.SiteFooterModel
    accessors: [logoReference, logoAlt, homeUrl, racingGroupTitle, racingLinks, whyGroupTitle, whyLinks, socialGroupTitle, socialLinks, copyrightText, legalLinks, falconReference, falconDecorative]
  - name: experiencefragment
    role: locked template references to canonical chrome masters
    reuse_or_new: reuse-core-proxy
    extends: core/wcm/components/experiencefragment/v2/experiencefragment
    sling_model_class: core-component-inherited
