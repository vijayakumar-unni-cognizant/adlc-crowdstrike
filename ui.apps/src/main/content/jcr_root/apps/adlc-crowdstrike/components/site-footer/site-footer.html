<sly data-sly-use.model="com.adlccrowdstrike.aem.core.models.SiteFooterModel"/>
<footer class="cmp-site-footer ${currentStyle.cssClasses}">
  <div class="cmp-site-footer__inner">
    <a data-sly-test="${model.homeUrl}" class="cmp-site-footer__brand" href="${model.homeUrl @ context='uri'}"><img data-sly-test="${model.logoReference}" class="cmp-site-footer__logo" src="${model.logoReference @ context='uri'}" alt="${model.logoAlt}"/><span data-sly-test="${!model.logoReference}">${model.logoAlt}</span></a>
    <nav class="cmp-site-footer__groups" aria-label="${'Footer navigation' @ i18n}">
      <section data-sly-test="${model.racingLinks}" class="cmp-site-footer__group"><h2 class="cmp-site-footer__heading">${model.racingGroupTitle}</h2><ul class="cmp-site-footer__links"><li data-sly-list.item="${model.racingLinks}"><a class="cmp-site-footer__link" href="${item.url @ context='uri'}" target="${item.external ? '_blank' : ''}" rel="${item.external ? 'noopener noreferrer' : ''}">${item.label}</a></li></ul></section>
      <section data-sly-test="${model.whyLinks}" class="cmp-site-footer__group"><h2 class="cmp-site-footer__heading">${model.whyGroupTitle}</h2><ul class="cmp-site-footer__links"><li data-sly-list.item="${model.whyLinks}"><a class="cmp-site-footer__link" href="${item.url @ context='uri'}" target="${item.external ? '_blank' : ''}" rel="${item.external ? 'noopener noreferrer' : ''}">${item.label}</a></li></ul></section>
      <section data-sly-test="${model.socialLinks}" class="cmp-site-footer__group"><h2 class="cmp-site-footer__heading">${model.socialGroupTitle}</h2><ul class="cmp-site-footer__social"><li data-sly-list.item="${model.socialLinks}"><a class="cmp-site-footer__social-link" href="${item.url @ context='uri'}" target="${item.external ? '_blank' : ''}" rel="${item.external ? 'noopener noreferrer' : ''}" aria-label="${item.label}"><img data-sly-test="${item.iconReference}" class="cmp-site-footer__social-icon" src="${item.iconReference @ context='uri'}" alt=""/><span data-sly-test="${!item.iconReference}">${item.label}</span></a></li></ul></section>
    </nav>
    <div class="cmp-site-footer__legal"><img data-sly-test="${model.falconReference}" class="cmp-site-footer__falcon" src="${model.falconReference @ context='uri'}" alt="${model.falconDecorative ? '' : model.logoAlt}"/><p class="cmp-site-footer__copyright">${model.copyrightText}</p><ul data-sly-test="${model.legalLinks}" class="cmp-site-footer__legal-links"><li data-sly-list.item="${model.legalLinks}"><a href="${item.url @ context='uri'}" target="${item.external ? '_blank' : ''}" rel="${item.external ? 'noopener noreferrer' : ''}">${item.label}</a></li></ul></div>
  </div>
</footer>
